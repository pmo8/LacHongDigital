<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="bimPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d0201"/>
      <stop offset="100%" stop-color="#3b0201"/>
    </linearGradient>
    <linearGradient id="bimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="bimCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- 3D BIM Cube + IOC Radar Icon -->
  <g transform="translate(15, 20)">
    <!-- Base container -->
    <rect x="5" y="5" width="110" height="110" rx="20" fill="#fef2f2" stroke="#5d0201" stroke-width="2.5"/>
    
    <!-- Isometric 3D Cube (BIM) -->
    <!-- Top Face -->
    <polygon points="60,25 90,40 60,55 30,40" fill="#d4af37" opacity="0.95"/>
    <!-- Left Face -->
    <polygon points="30,40 60,55 60,90 30,75" fill="#5d0201"/>
    <!-- Right Face -->
    <polygon points="60,55 90,40 90,75 60,90" fill="#8f100f"/>

    <!-- IOC Data Nodes / Smart Rings -->
    <circle cx="60" cy="55" r="4" fill="#ffffff"/>
    <circle cx="60" cy="55" r="38" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Pulse sensor dots -->
    <circle cx="28" cy="55" r="3" fill="#0284c7"/>
    <circle cx="92" cy="55" r="3" fill="#0284c7"/>
    <circle cx="60" cy="98" r="3" fill="#0284c7"/>
  </g>

  <!-- Typography -->
  <g transform="translate(145, 30)">
    <!-- Main Acronym -->
    <text x="0" y="42" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#5d0201" letter-spacing="1">
      BIM CENTER
    </text>
    
    <!-- IOC badge -->
    <rect x="235" y="15" width="55" height="30" rx="6" fill="#0284c7"/>
    <text x="262" y="36" font-family="'Montserrat', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      &amp; IOC
    </text>
    
    <!-- Line accent -->
    <rect x="0" y="54" width="290" height="3" rx="1.5" fill="url(#bimGold)"/>
    
    <!-- Subtitle -->
    <text x="0" y="75" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#18181b" letter-spacing="0.5">
      MÔ HÌNH THÔNG TIN CÔNG TRÌNH
    </text>
    <text x="0" y="93" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#b45309" letter-spacing="0.5">
      &amp; TRUNG TÂM ĐIỀU HÀNH THÔNG MINH
    </text>
  </g>
</svg>
