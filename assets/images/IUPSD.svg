<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="iupsdGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="iupsdBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Sustainable Urban Skyline + Eco Leaf -->
  <g transform="translate(15, 20)">
    <!-- Shield / Leaf Base -->
    <rect x="5" y="5" width="110" height="110" rx="20" fill="#f0fdf4" stroke="#059669" stroke-width="2.5"/>
    
    <!-- Stylized Modern Buildings -->
    <rect x="25" y="45" width="18" height="55" rx="3" fill="url(#iupsdBlue)"/>
    <rect x="48" y="28" width="22" height="72" rx="3" fill="url(#iupsdGreen)"/>
    <rect x="75" y="52" width="18" height="48" rx="3" fill="url(#iupsdBlue)"/>
    
    <!-- Building Windows -->
    <circle cx="34" cy="55" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="34" cy="65" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="34" cy="75" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="59" cy="38" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="59" cy="50" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="59" cy="62" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="59" cy="74" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="84" cy="62" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="84" cy="72" r="2" fill="#ffffff" opacity="0.8"/>
    
    <!-- Eco Arc / Sustainable Leaf curve -->
    <path d="M 20 85 Q 60 112 100 85 Q 60 98 20 85 Z" fill="#10b981"/>
    <circle cx="60" cy="18" r="6" fill="#f59e0b"/>
  </g>

  <!-- Typography -->
  <g transform="translate(145, 30)">
    <!-- Acronym -->
    <text x="0" y="42" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#047857" letter-spacing="2">
      IUPSD
    </text>
    
    <!-- Line accent -->
    <rect x="0" y="52" width="240" height="3" rx="1.5" fill="url(#iupsdGreen)"/>
    
    <!-- Subtitle -->
    <text x="0" y="74" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="0.5">
      VIỆN QUY HOẠCH
    </text>
    <text x="0" y="93" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="700" fill="#059669" letter-spacing="0.3">
      PHÁT TRIỂN ĐÔ THỊ BỀN VỮNG
    </text>
  </g>
</svg>
