<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d070"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997300"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e0c0b"/>
      <stop offset="100%" stop-color="#3e0100"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Emblem: Shield + Stylized Chim Lạc + Digital Circuit Nodes -->
  <g transform="translate(10, 10)">
    <!-- Base Shield -->
    <path d="M 40 0 L 75 18 C 75 52 50 72 40 80 C 30 72 5 52 5 18 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadow)"/>
    <!-- Outer Gold Ring Accent -->
    <path d="M 40 6 L 68 21 C 68 47 48 64 40 71 C 32 64 12 47 12 21 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,2"/>
    
    <!-- Stylized Chim Lạc (Wings soaring high with digital precision) -->
    <!-- Head & Beak -->
    <path d="M 40 16 C 43 14 48 13 52 14 C 55 15 53 18 47 19 C 43 20 40 23 40 23 Z" fill="url(#goldGrad)"/>
    <!-- Eye Node -->
    <circle cx="44" cy="17" r="1.5" fill="#5d0201"/>
    <!-- Majestic Wing Top -->
    <path d="M 40 23 C 48 18 64 22 66 32 C 60 30 52 30 45 32 C 41 33 40 37 40 37 Z" fill="url(#goldGrad)"/>
    <!-- Wing Middle Feather -->
    <path d="M 40 28 C 49 26 62 33 61 42 C 55 38 48 39 42 41 C 40 42 39 46 39 46 Z" fill="url(#goldGrad)"/>
    <!-- Wing Lower Feather -->
    <path d="M 39 36 C 47 35 56 42 53 50 C 48 46 44 47 38 49 Z" fill="url(#goldGrad)"/>
    <!-- Tail & Digital Base Nodes -->
    <path d="M 39 44 C 36 50 31 58 26 62 C 29 55 33 49 35 44 Z" fill="url(#goldGrad)"/>
    <!-- Tech Nodes & Connections -->
    <circle cx="24" cy="30" r="2.2" fill="url(#goldGrad)"/>
    <circle cx="28" cy="40" r="1.8" fill="url(#goldGrad)"/>
    <circle cx="20" cy="46" r="2.2" fill="url(#goldGrad)"/>
    <line x1="24" y1="30" x2="28" y2="40" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="28" y1="40" x2="20" y2="46" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <line x1="28" y1="40" x2="35" y2="44" stroke="url(#goldGrad)" stroke-width="1.2"/>
  </g>

  <!-- Typography -->
  <!-- Institution Title -->
  <text x="105" y="32" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="12" fill="#5d0201" letter-spacing="0.8">
    VIỆN NGHIÊN CỨU CHIẾN LƯỢC &amp; PHÁT TRIỂN LẠC HỒNG
  </text>
  
  <!-- Company Main Name -->
  <text x="105" y="64" font-family="'Montserrat', 'Arial', sans-serif" font-weight="900" font-size="28" fill="#5d0201" letter-spacing="1">
    LẠC HỒNG <tspan fill="url(#goldGrad)">DIGITAL</tspan>
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="106" y="83" font-family="'Lato', 'Roboto', sans-serif" font-weight="600" font-size="10.5" fill="#666666" letter-spacing="1.5">
    VIỆN NGHIÊN CỨU • KHUNG NĂNG LỰC PMO • TÍCH HỢP SỐ
  </text>

  <!-- Decorative Separator Line -->
  <line x1="105" y1="40" x2="480" y2="40" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6"/>
</svg>
