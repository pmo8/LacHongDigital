<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e0100"/>
      <stop offset="50%" stop-color="#5d0201"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#1f0303"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae29c"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid overlay -->
  <path d="M 0 50 H 600 M 0 100 H 600 M 0 150 H 600 M 0 200 H 600 M 0 250 H 600 M 0 300 H 600 M 0 350 H 600" stroke="#d4af37" stroke-width="0.3" stroke-opacity="0.2"/>
  <path d="M 50 0 V 400 M 100 0 V 400 M 150 0 V 400 M 200 0 V 400 M 250 0 V 400 M 300 0 V 400 M 350 0 V 400 M 400 0 V 400 M 450 0 V 400 M 500 0 V 400 M 550 0 V 400" stroke="#d4af37" stroke-width="0.3" stroke-opacity="0.2"/>

  <!-- Center Core: Agile PMO & BIM-CDE -->
  <circle cx="300" cy="200" r="68" fill="url(#cardGrad)" stroke="url(#accentGold)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="300" cy="200" r="58" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="300" y="192" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#fae29c" text-anchor="middle">AGILE PMO</text>
  <text x="300" y="210" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">BIM - CDE</text>
  <text x="300" y="226" font-family="'Lato', sans-serif" font-weight="400" font-size="9" fill="#d4af37" text-anchor="middle">Hạt Nhân Tích Hợp Số</text>

  <!-- Connecting Nodes Orbit Rings -->
  <!-- Top Node: Quy hoạch & Thể chế -->
  <line x1="300" y1="132" x2="300" y2="75" stroke="url(#accentGold)" stroke-width="1.8" stroke-dasharray="3,3"/>
  <rect x="200" y="30" width="200" height="48" rx="8" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5"/>
  <text x="300" y="52" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#fae29c" text-anchor="middle">CHIẾN LƯỢC &amp; THỂ CHẾ</text>
  <text x="300" y="67" font-family="'Lato', sans-serif" font-weight="400" font-size="10" fill="#e2e8f0" text-anchor="middle">Quy hoạch • Chuẩn hóa định chế</text>

  <!-- Right Node: Hạ tầng số & Kỹ thuật ngầm -->
  <line x1="368" y1="200" x2="435" y2="200" stroke="url(#accentGold)" stroke-width="1.8" stroke-dasharray="3,3"/>
  <rect x="435" y="175" width="145" height="52" rx="8" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5"/>
  <text x="507" y="197" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#fae29c" text-anchor="middle">HẠ TẦNG KỸ THUẬT</text>
  <text x="507" y="212" font-family="'Lato', sans-serif" font-weight="400" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Số hóa Layout • GIS ngầm</text>

  <!-- Bottom Node: Kiểm soát & Điều hành -->
  <line x1="300" y1="268" x2="300" y2="320" stroke="url(#accentGold)" stroke-width="1.8" stroke-dasharray="3,3"/>
  <rect x="195" y="320" width="210" height="50" rx="8" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5"/>
  <text x="300" y="342" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#fae29c" text-anchor="middle">ĐIỀU HÀNH THỰC THI</text>
  <text x="300" y="357" font-family="'Lato', sans-serif" font-weight="400" font-size="10" fill="#e2e8f0" text-anchor="middle">Dashboard CDE • Giám sát realtime</text>

  <!-- Left Node: Chuẩn hóa năng lực & Đào tạo -->
  <line x1="232" y1="200" x2="165" y2="200" stroke="url(#accentGold)" stroke-width="1.8" stroke-dasharray="3,3"/>
  <rect x="20" y="175" width="145" height="52" rx="8" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5"/>
  <text x="92" y="197" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#fae29c" text-anchor="middle">KHUNG NĂNG LỰC</text>
  <text x="92" y="212" font-family="'Lato', sans-serif" font-weight="400" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Đào tạo PMO • Kỹ sư số</text>
</svg>
